<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Model Viewer AR - VR</title>
  <meta name="description" content="Model Viewer (VR / AR) • A-Frame">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/info-message.js"></script>
  <script src="animation-mixer.js"></script>
  <script src="ar-shadows.js"></script>
  <script src="model-viewer.js"></script>
  <script src="background-gradient.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/remix-dropdown.js"></script>
</head>
<body>
 
<a-scene
  info-message="htmlSrc: #messageText"
  model-viewer="gltfModel: #scp; title: scp"
  xr-mode-ui="XRMode: xr">
  <a-assets timeout="10000">
 
    <a-asset-item id="scp"
      src="scp.glb"
      response-type="arraybuffer"></a-asset-item>
 
    <img id="shadow" src="shadow.png">
    <a-asset-item id="messageText" src="message.html"></a-asset-item>
  </a-assets>
</a-scene>
</body>
</html>
