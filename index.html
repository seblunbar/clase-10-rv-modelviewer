<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Feng Huang AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.75, maximum-scale=0.75, user-scalable=no" />
  
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    /* Asegura que el canvas y el body tengan fondo transparente */
    body, html {
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .a-canvas {
      background-color: transparent !important;
    }
  </style>
</head>
<body>

<a-scene
  webxr="optionalFeatures: hit-test, dom-overlay"
  xr-mode-ui="XRMode: ar"
  background="transparent: true">

  <a-assets timeout="10000">
    <a-asset-item id="scp" src="scp.glb"></a-asset-item>
  </a-assets>

  <a-entity
    gltf-model="#scp"
    animation-mixer="clip: *; loop: repeat"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 50000; easing: linear"
    position="0 -2.5 -4"
    scale="1 1 1"
    rotation="0 0 0">
  </a-entity>

  <a-light type="ambient" intensity="0.9"></a-light>
  <a-light type="directional" intensity="0.6" position="1 3 2"></a-light>

</a-scene>
</body>
</html>
